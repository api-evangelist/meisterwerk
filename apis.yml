aid: meisterwerk
name: Meisterwerk
description: >-
  Meisterwerk is a modular all-in-one SaaS platform for German-speaking (DACH)
  trades and craft businesses (Handwerk), built by MEISTERWERK APP GmbH in
  Berlin. It gives small and medium craft firms (1-50 employees) a single
  operating system for job and resource scheduling (Einsatzplanung), a native
  mobile app for iOS, Android and Windows, chronological job documentation with
  photos and chat, quoting and invoicing with e-invoice support, EU-compliant
  mobile time tracking with GPS, digital forms and signatures, absence/holiday
  planning, and configurable workflows. AI features (planning assistant,
  speech-to-text documentation and time entry, and the standalone "Frag Maxi"
  phone assistant) are built in. It integrates with lexoffice, sevdesk, bexio
  and orgaMAX accounting software; a public open interface (Offene Schnittstelle)
  is announced but not yet publicly documented. Over 8,000 active users; data is
  hosted on servers in Germany and the platform is GDPR (DSGVO) compliant.
